<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charisma Signature — how do you actually come across?</title>
<meta name="description" content="A 2-minute test that maps how you come across on four dimensions, then gives you Day 1 of a plan to fix the one thing holding you back.">
<meta name="theme-color" content="#0E0E12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F6F2F7" media="(prefers-color-scheme: light)">
<meta property="og:title" content="What's your charisma signature?">
<meta property="og:description" content="10 questions. Four dimensions. One habit to change first.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800;900&family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
/* ============================================================
   CHARISMA SIGNATURE v3 — flat "sticker" style
   Solid ground, hard-shadow pressable buttons, colour-coded
   sections, no blurred gradients. Unbounded for display type
   (full Cyrillic), Golos Text for reading copy.
   ============================================================ */
:root{
  --bg:#0E0E12; --surface:#17171E; --raised:#1D1D26; --deep:#0A0A0D;
  --ink:#F5F4F7; --mute:#8E8B9C; --edge:rgba(255,255,255,.09); --edge-2:rgba(255,255,255,.16);
  --primary:#FF7A1A; --primary-ink:#1A1206; --primary-sh:#B8500A;
  --blue:#4C7CFF; --blue-ink:#FFFFFF; --blue-sh:#2C4FC4;
  --gold:#FFC736; --gold-ink:#241A02; --gold-sh:#C4930C;
  --green:#33CE82; --green-ink:#052014; --green-sh:#1D9A5D;
  --red:#FF6470;
  --bg:var(--bg); --surface:var(--surface); --text:var(--ink);
  --field:1;

  --step:clamp(.92rem,.58rem + 1.05vw,1.05rem);
  --r-sm:12px; --r-md:18px; --r-lg:24px; --r-xl:30px;
  --gut:clamp(18px,5vw,28px); --col:min(560px,100%);
  --ease:cubic-bezier(.2,.85,.3,1.15);
  --ease-soft:cubic-bezier(.22,.9,.28,1);
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",ui-sans-serif,system-ui,-apple-system,sans-serif;
}
[data-theme="light"]{
  --bg:#F4F1EC; --surface:#FFFFFF; --raised:#FFFFFF; --deep:#EAE5DB;
  --text:#1B1710; --mute:#7A7466;
  --edge:rgba(27,23,16,.10); --edge-2:rgba(27,23,16,.20);
  --primary:#E8620E; --primary-ink:#FFFFFF; --primary-sh:#B84A08;
  --blue:#3357D6; --blue-ink:#FFFFFF; --blue-sh:#1F3C9E;
  --gold:#C98A00; --gold-ink:#FFFFFF; --gold-sh:#8F6100;
  --green:#0F9D58; --green-ink:#FFFFFF; --green-sh:#0A7440;
  --field:1;
}
@media (prefers-color-scheme:light){[data-theme="auto"]{
  --bg:#F4F1EC; --surface:#FFFFFF; --raised:#FFFFFF; --deep:#EAE5DB;
  --text:#1B1710; --mute:#7A7466;
  --edge:rgba(27,23,16,.10); --edge-2:rgba(27,23,16,.20);
  --primary:#E8620E; --primary-ink:#FFFFFF; --primary-sh:#B84A08;
  --blue:#3357D6; --blue-ink:#FFFFFF; --blue-sh:#1F3C9E;
  --gold:#C98A00; --gold-ink:#FFFFFF; --gold-sh:#8F6100;
  --green:#0F9D58; --green-ink:#FFFFFF; --green-sh:#0A7440;
}}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.52;
  min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  transition:background-color .4s var(--ease-soft),color .4s var(--ease-soft)}
button,input,select{font:inherit;color:inherit}
button{-webkit-appearance:none;appearance:none;margin:0;padding:0;text-align:center}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;line-height:1.08;margin:0}
p{margin:0}

/* flat backdrop — a single soft vignette, no drifting colour blobs */
.field{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 70% at 50% -10%, color-mix(in srgb,var(--primary) 10%,transparent), transparent 60%)}
.orb{display:none}

.shell{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 12px) var(--gut) 12px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.tools{display:flex;gap:6px;align-items:center}
.icon-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:14px;
  background:var(--surface);border:2px solid var(--edge);cursor:pointer;flex-shrink:0;
  transition:border-color .15s,transform .12s var(--ease)}
.icon-btn:hover{border-color:var(--edge-2)}
.icon-btn:active{transform:scale(.9)}
.icon-btn[hidden]{visibility:hidden;display:flex}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;display:block;flex-shrink:0}
.lang{height:40px;border-radius:14px;border:2px solid var(--edge);background:var(--surface);padding:0 10px;cursor:pointer;font-size:13px;font-weight:600}

/* progress: thick pill trail, colour-coded per section, small puck marker */
.progress{display:flex;flex-direction:column;gap:7px;opacity:0;transition:opacity .35s var(--ease-soft)}
.progress.on{opacity:1}
.segs{display:flex;gap:4px}
.seg{flex:1;height:8px;border-radius:99px;background:var(--edge);overflow:hidden;position:relative}
.seg i{display:block;height:100%;width:0;border-radius:99px;transition:width .4s var(--ease-soft)}
.seg.done i,.seg.now i{width:100%}
.seg[data-sec="0"] i{background:var(--blue)}
.seg[data-sec="1"] i{background:var(--primary)}
.seg[data-sec="2"] i{background:var(--gold)}
.seg[data-sec="3"] i{background:var(--green)}
.seg.now{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--edge-2)}
.plabel{font-family:var(--font-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);
  text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.plabel b{color:var(--primary);font-weight:800}

main{flex:1;display:flex;flex-direction:column;padding:0 var(--gut) calc(env(safe-area-inset-bottom) + 32px)}
.screen{display:none;flex:1;flex-direction:column;justify-content:flex-start;width:var(--col);margin:0 auto;padding:14px 0 8px}
.screen > *:first-child{margin-top:auto}
.screen > *:last-child{margin-bottom:auto}
.screen.on{display:flex;animation:rise .4s var(--ease-soft) both}
.screen.out{animation:sink .15s var(--ease-soft) both}
@keyframes rise{from{opacity:0;transform:translate3d(0,16px,0)}to{opacity:1;transform:none}}
@keyframes sink{to{opacity:0;transform:translate3d(0,-10px,0)}}

/* hero */
.hero{position:relative}
.sparkle{position:absolute;fill:var(--gold)}
.sparkle-a{width:24px;height:24px;top:-8px;right:16%;animation:spin-slow 8s linear infinite}
.sparkle-b{width:15px;height:15px;fill:var(--blue);top:38px;right:5%;animation:spin-slow 5.5s linear infinite reverse}
@keyframes spin-slow{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.eyebrow{font-family:var(--font-display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);
  display:flex;align-items:center;gap:8px;font-weight:600}
.eyebrow::before{content:"";width:20px;height:3px;border-radius:2px;background:var(--primary)}
.hero h1{font-size:clamp(2rem,1.15rem + 3.9vw,3.1rem);margin:18px 0 0;font-weight:800}
.hero h1 em{font-style:normal;color:var(--primary)}
.lede{color:var(--mute);font-size:1.02rem;margin-top:16px;max-width:46ch}
.hero-facts{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.hero-facts li{font-size:12.5px;font-weight:600;color:var(--text);background:var(--surface);
  border:2px solid var(--edge);border-radius:99px;padding:7px 13px}

/* mascot blob — simple flat character, no illustration asset needed */
.mascot{width:104px;height:104px;margin:0 0 8px}
.mascot .body{fill:var(--primary)}
.mascot .cheek{fill:#000;opacity:.12}
.mascot .eye{fill:#171018}
.mascot .mouth{stroke:#171018;stroke-width:3.4;stroke-linecap:round;fill:none}
.mascot.blue .body{fill:var(--blue)}
.mascot.green .body{fill:var(--green)}

/* buttons: flat colour, hard offset shadow, press-down interaction */
.cta{margin-top:22px;width:100%;min-height:60px;border:0;border-radius:99px;cursor:pointer;
  background:var(--primary);color:var(--primary-ink);
  font-family:var(--font-display);font-weight:700;font-size:1rem;letter-spacing:0;
  display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 5px 0 var(--primary-sh);
  transition:transform .1s var(--ease),box-shadow .1s var(--ease)}
.cta:hover{transform:translateY(-1px);box-shadow:0 6px 0 var(--primary-sh)}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 var(--primary-sh)}
.cta:disabled{filter:saturate(.4) opacity(.7);cursor:progress;transform:none;box-shadow:0 5px 0 var(--primary-sh)}
.cta svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.cta.ghost{background:var(--surface);color:var(--text);border:2px solid var(--edge-2);box-shadow:0 4px 0 var(--edge);
  margin-top:10px;min-height:52px;font-size:.92rem}
.reassure{text-align:center;font-size:12.5px;color:var(--mute);margin-top:14px;display:flex;align-items:center;justify-content:center;gap:7px}
.reassure svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}

/* questions */
.qhead{margin-bottom:20px}
.qkicker{font-family:var(--font-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);font-weight:700}
.qhead h2{font-size:clamp(1.4rem,1rem + 1.8vw,1.9rem);margin-top:10px;font-weight:700}
.qhelp{color:var(--mute);font-size:14.5px;margin-top:10px}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:60px;
  padding:14px 16px;border-radius:var(--r-md);cursor:pointer;background:var(--surface);border:2px solid var(--edge);
  color:var(--text);font-size:var(--step);line-height:1.3;
  transition:border-color .15s,transform .12s var(--ease),box-shadow .15s}
.opt:hover{border-color:var(--edge-2);transform:translateY(-2px)}
.opt .key{flex:0 0 30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:10px;
  background:var(--deep);font-family:var(--font-display);font-size:12.5px;font-weight:700;color:var(--mute);
  font-variant-numeric:tabular-nums;transition:background .15s,color .15s}
.opt .txt{flex:1}
.opt .sub{display:block;font-size:12.5px;color:var(--mute);margin-top:3px;font-weight:400}
.opt.picked{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 14%,var(--surface));
  box-shadow:0 4px 0 var(--primary-sh);transform:translateY(-2px)}
.opt.picked .key{background:var(--primary);color:var(--primary-ink)}
.opt.chosen{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,var(--surface));box-shadow:0 4px 0 var(--blue-sh)}
.opt.chosen .key{background:var(--blue);color:var(--blue-ink)}
.opt.card{flex-direction:column;align-items:flex-start;justify-content:center;min-height:80px;gap:2px}
.tagwrap{display:flex;flex-wrap:wrap;gap:9px}
.tag{border:2px solid var(--edge);background:var(--surface);border-radius:99px;padding:11px 16px;font-size:14.5px;
  font-weight:600;cursor:pointer;transition:border-color .15s,transform .1s var(--ease)}
.tag:hover{border-color:var(--edge-2)}
.tag:active{transform:scale(.95)}
.tag.chosen{background:var(--blue);border-color:var(--blue);color:var(--blue-ink);box-shadow:0 3px 0 var(--blue-sh)}

.scale{display:flex;gap:7px;justify-content:space-between;margin-top:6px}
.sc{flex:1;min-height:76px;border-radius:var(--r-md);border:2px solid var(--edge);background:var(--surface);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin:0;
  font-size:11px;font-weight:600;color:var(--mute);line-height:1.15;text-align:center;padding:8px 4px;
  transition:border-color .15s,transform .12s var(--ease)}
.sc span{width:9px;height:9px;border-radius:50%;background:currentColor;display:block}
.sc:hover{border-color:var(--edge-2);transform:translateY(-2px)}
.sc.picked{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);box-shadow:0 4px 0 var(--primary-sh)}
.statement{font-family:var(--font-display);font-size:clamp(1.25rem,.95rem + 1.5vw,1.65rem);font-weight:700;
  line-height:1.24;letter-spacing:-.005em;margin:0 0 6px}
.statement::before{content:"\201C"}
.statement::after{content:"\201D"}

.card{background:var(--surface);border:2px solid var(--edge);border-radius:var(--r-lg);padding:22px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--primary)}
.card + .card{margin-top:12px}
.card h3{font-size:1.08rem;margin-bottom:8px;font-weight:700}
.card p{color:var(--mute);font-size:14.5px}
.card-label{font-family:var(--font-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);font-weight:700;margin-bottom:10px}
.stack{margin-top:20px}

.proof{text-align:center}
.big{font-family:var(--font-display);font-size:clamp(2rem,1.3rem + 3vw,2.7rem);font-weight:800;color:var(--primary);letter-spacing:-.02em}
.stars{color:var(--gold);letter-spacing:3px;font-size:16px}
.press{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;margin-top:16px;opacity:.55;font-size:12.5px;
  font-family:var(--font-display);font-weight:700;letter-spacing:.03em}
.quote{font-size:15px;line-height:1.5;color:var(--text)}
.byline{font-size:12.5px;color:var(--mute);margin-top:10px;font-weight:600}
.cite{font-size:12px;color:var(--mute);margin-top:12px;font-style:italic}

.dims{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.dimcard{border:2px solid var(--edge);background:var(--surface);border-radius:var(--r-md);padding:14px;position:relative;overflow:hidden}
.dimcard:nth-child(1)::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--blue)}
.dimcard:nth-child(2)::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--primary)}
.dimcard:nth-child(3)::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--gold)}
.dimcard:nth-child(4)::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--green)}
.dimcard b{font-family:var(--font-display);font-size:14.5px;display:block;margin-bottom:4px;font-weight:700}
.dimcard span{font-size:12.5px;color:var(--mute);line-height:1.35}

.gauge{margin-top:10px}
.gaugebar{height:14px;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--gold),var(--primary));position:relative;margin:28px 0 8px}
.gaugebar i{position:absolute;top:-7px;width:5px;height:28px;border-radius:3px;background:var(--text);transition:left 1s var(--ease-soft)}
.gaugebar em{position:absolute;top:-32px;transform:translateX(-50%);font-style:normal;font-family:var(--font-display);
  font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--text);color:var(--bg);
  padding:3px 9px;border-radius:8px;white-space:nowrap;transition:left 1s var(--ease-soft)}
.gaugelabels{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.echo{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:10px}
.echo li{display:flex;gap:10px;font-size:14.2px;align-items:baseline}
.echo b{flex:0 0 92px;font-family:var(--font-display);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);font-weight:700}

.pulse{width:88px;height:88px;margin:0 auto 24px;position:relative}
.pulse i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--primary);opacity:0;animation:ping 2.2s var(--ease-soft) infinite}
.pulse i:nth-child(2){animation-delay:.7s}
.pulse i:nth-child(3){animation-delay:1.4s}
.pulse b{position:absolute;inset:32%;border-radius:50%;background:var(--primary);animation:breathe 2.2s var(--ease-soft) infinite;margin:0}
@keyframes ping{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1);opacity:0}}
@keyframes breathe{50%{transform:scale(1.15)}}
.checks{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:2px}
.checks li{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:2px solid var(--edge);font-size:14.5px;font-weight:600;color:var(--mute)}
.checks li:first-child{border-top:0}
.checks li.done{color:var(--text)}
.checks .mark{margin-left:auto;font-family:var(--font-display);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--mute)}
.checks li.done .mark{color:var(--green)}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:24px;
  background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(5px)}
.modal.on{display:flex;animation:rise .28s var(--ease-soft) both}
.modal .box{background:var(--raised);border:2px solid var(--edge);border-radius:var(--r-lg);padding:22px;max-width:380px;width:100%}
.modal .lbl{font-family:var(--font-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:8px;font-weight:700}
.modal h3{font-size:1.1rem;margin-bottom:16px;font-weight:700}
.modal .row{display:flex;gap:9px}
.modal .row button{flex:1;min-height:50px;border-radius:var(--r-md);border:2px solid var(--edge-2);background:var(--surface);
  cursor:pointer;font-size:14.5px;font-weight:600;transition:border-color .15s,transform .1s}
.modal .row button:hover{border-color:var(--primary)}
.modal .row button:active{transform:scale(.96)}

.sig{width:100%;max-width:320px;margin:4px auto 0;display:block;overflow:visible}
.sig .ring{fill:none;stroke:var(--edge);stroke-width:1.5}
.sig .blob{fill:color-mix(in srgb,var(--primary) 20%,transparent);stroke:var(--primary);stroke-width:3;stroke-linejoin:round;
  stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.3s var(--ease-soft) .1s forwards}
.sig .dot{fill:var(--gold);opacity:0;animation:fadein .4s var(--ease-soft) 1s forwards}
.sig .lbl{font-family:var(--font-display);font-size:10.5px;font-weight:700;letter-spacing:.05em;fill:var(--mute);text-transform:uppercase}
.sig .val{font-family:var(--font-display);font-size:15px;font-weight:800;fill:var(--text)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
.badge{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);
  border-radius:99px;padding:8px 16px;font-family:var(--font-display);font-size:11.5px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;color:var(--blue-ink);box-shadow:0 3px 0 var(--blue-sh)}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
.arch{font-size:clamp(1.7rem,1.15rem + 2.6vw,2.35rem);margin:14px 0 0;font-weight:800}
.arch small{display:block;font-family:var(--font-body);font-size:.95rem;font-weight:400;letter-spacing:0;color:var(--mute);margin-top:12px;line-height:1.55}
.aisum{border-left:4px solid var(--primary);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:4px 0 4px 16px;margin-top:20px;font-size:15.5px;line-height:1.6}
.aisum .tag-ai{font-family:var(--font-display);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);display:block;margin-bottom:8px;font-weight:700}
.skel{height:14px;border-radius:7px;background:var(--edge);margin-bottom:9px;animation:shimmer 1.3s var(--ease-soft) infinite}
.skel:nth-child(2){width:88%}.skel:nth-child(3){width:72%}
@keyframes shimmer{50%{opacity:.4}}
.locked{position:relative;margin-top:18px}
.locked .card p,.locked .card h3{filter:blur(5px);user-select:none}
.locked .veil{position:absolute;inset:0;display:grid;place-items:center;border-radius:var(--r-lg);
  background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--bg) 85%,transparent) 62%)}
.locked .veil span{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;background:var(--raised);
  border:2px solid var(--edge);border-radius:99px;padding:9px 16px}
.locked .veil svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2}

input[type=email]{width:100%;min-height:58px;padding:16px 18px;border-radius:var(--r-md);background:var(--surface);
  border:2px solid var(--edge-2);font-size:16px;font-weight:600;outline:none;transition:border-color .15s,box-shadow .15s}
input[type=email]::placeholder{color:var(--mute);font-weight:400}
input[type=email]:focus{border-color:var(--primary);box-shadow:0 4px 0 color-mix(in srgb,var(--primary) 40%,transparent)}
input[type=email][aria-invalid=true]{border-color:var(--red)}
.err{color:var(--red);font-size:13.5px;margin-top:9px;min-height:19px;font-weight:600}
.preview{list-style:none;padding:0;margin:18px 0 0;display:flex;flex-direction:column;gap:11px}
.preview li{display:flex;gap:11px;align-items:flex-start;font-size:14.5px;color:var(--mute)}
.preview svg{flex:0 0 20px;width:20px;height:20px;padding:2px;border-radius:6px;background:var(--green);
  stroke:var(--green-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.preview b{color:var(--text)}
.consent{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:12.5px;color:var(--mute);cursor:pointer}
.consent input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--primary);flex:0 0 18px}

.done-mark{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:18px;
  background:var(--green);box-shadow:0 5px 0 var(--green-sh)}
.done-mark svg{width:30px;height:30px;stroke:var(--green-ink);fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s var(--ease-soft) .3s forwards}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:13px;padding:14px 0;border-top:2px solid var(--edge)}
.steps li:first-child{border-top:0;padding-top:4px}
.steps li::before{content:counter(s);flex:0 0 28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:var(--primary);color:var(--primary-ink);font-size:12.5px;font-weight:700;font-family:var(--font-display)}
.steps b{display:block;font-weight:700;margin-bottom:3px;font-size:15px}
.steps p{font-size:14px}
.week div{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-top:2px dashed var(--edge);font-size:14px;color:var(--mute)}
.week div:first-child{border-top:0}
.week span{flex:0 0 54px;font-family:var(--font-display);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--primary);font-weight:700}
.promise{text-align:center;font-family:var(--font-display);font-size:clamp(1.2rem,.95rem + 1.4vw,1.55rem);font-weight:700;
  line-height:1.3;margin-top:22px}
.promise em{font-style:normal;color:var(--primary)}
.share-row{display:flex;gap:9px;margin-top:16px}
.share-row button{flex:1;min-height:52px;border-radius:var(--r-md);border:2px solid var(--edge-2);background:var(--surface);
  cursor:pointer;font-size:14.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:border-color .15s,transform .1s}
.share-row button:hover{border-color:var(--primary)}
.share-row svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.foot{text-align:center;font-size:12px;color:var(--mute);padding:24px var(--gut) 0}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;width:8px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(104vh) rotate(720deg);opacity:0}}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  .sig .blob{stroke-dashoffset:0}.sig .dot{opacity:1}.confetti{display:none}
}
@media (max-width:400px){
  .opt{min-height:56px;padding:12px}.sc{min-height:68px}
  .icon-btn,.done-mark,.pulse b,.badge i,.opt .key{margin-left:auto;margin-right:auto}
  .share-row button,.icon-btn{display:flex;align-items:center;justify-content:center}
}
</style>
</head>
<body>
<div class="field" aria-hidden="true"><div class="orb orb-a"></div><div class="orb orb-b"></div></div>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<div class="shell">
  <header class="topbar">
    <button class="icon-btn" id="back" hidden aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="progress" id="progress">
      <div class="segs" id="segs"></div>
      <div class="plabel" id="plabel" role="status" aria-live="polite"></div>
    </div>
    <div class="tools">
      <select class="lang" id="lang" aria-label="Language">
        <option value="en">EN</option><option value="uk">UA</option><option value="pl">PL</option>
      </select>
      <button class="icon-btn" id="theme" aria-label="Theme"><svg viewBox="0 0 24 24" id="theme-icon"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
    </div>
  </header>

  <main>
    <section class="screen hero on" id="s-hero">
      <svg class="sparkle sparkle-a" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"/></svg>
      <svg class="sparkle sparkle-b" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"/></svg>
      <svg class="mascot" viewBox="0 0 120 120" aria-hidden="true">
        <ellipse class="cheek" cx="33" cy="70" rx="9" ry="6"/><ellipse class="cheek" cx="87" cy="70" rx="9" ry="6"/>
        <path class="body" d="M60 8c26 0 45 20 45 46 0 24-18 44-45 56C33 98 15 78 15 54 15 28 34 8 60 8z"/>
        <circle class="eye" cx="44" cy="52" r="6"/><circle class="eye" cx="76" cy="52" r="6"/>
        <path class="mouth" d="M46 68q14 12 28 0"/>
      </svg>
      <div class="eyebrow" id="h-eyebrow"></div>
      <h1 id="h-title"></h1>
      <p class="lede" id="h-lede"></p>
      <ul class="hero-facts" id="h-facts"></ul>
      <button class="cta" id="start"><span id="h-cta"></span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <p class="reassure"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 118 0v3"/></svg><span id="h-reassure"></span></p>
    </section>

    <section class="screen" id="s-question">
      <div class="qhead">
        <div class="qkicker" id="q-kicker"></div>
        <h2 id="q-title"></h2>
        <p class="qhelp" id="q-help"></p>
      </div>
      <div id="q-body"></div>
      <button class="cta" id="q-next" hidden><span id="q-next-label"></span></button>
    </section>

    <section class="screen proof" id="s-proof">
      <div class="big" id="p-big"></div>
      <p class="lede" style="text-align:center;margin:6px auto 0" id="p-sub"></p>
      <div class="card stack">
        <div class="stars">★★★★★</div>
        <p class="quote" id="p-quote" style="margin-top:10px"></p>
        <p class="byline" id="p-byline"></p>
      </div>
      <p class="reassure" id="p-presslabel" style="margin-top:20px"></p>
      <div class="press">
        <span>Cambridge</span><span>Harvard</span><span>Stanford</span><span>Berkeley</span><span>Oxford</span>
      </div>
      <button class="cta" id="p-next"><span class="cont"></span></button>
    </section>

    <section class="screen" id="s-typology">
      <h2 id="ty-title" style="font-size:clamp(1.5rem,1.1rem + 2vw,2rem)"></h2>
      <p class="qhelp" id="ty-sub"></p>
      <div class="dims" id="ty-cards" style="margin-top:18px"></div>
      <p class="cite" id="ty-teaser"></p>
      <button class="cta" id="ty-next"><span class="cont"></span></button>
    </section>

    <section class="screen" id="s-stat">
      <div class="big" id="st-big"></div>
      <h2 id="st-title" style="font-size:clamp(1.3rem,1rem + 1.6vw,1.7rem);margin-top:8px"></h2>
      <p class="cite" id="st-cite"></p>
      <div class="card stack"><p id="st-body" style="color:var(--mute);font-size:14.5px"></p></div>
      <button class="cta" id="st-next"><span class="cont"></span></button>
    </section>

    <section class="screen" id="s-gauge">
      <h2 id="g-title" style="font-size:clamp(1.4rem,1.05rem + 1.8vw,1.9rem)"></h2>
      <div class="card stack">
        <div class="card-label" id="g-label"></div>
        <div class="gauge">
          <div class="gaugebar"><em id="g-mark"></em><i id="g-pin"></i></div>
          <div class="gaugelabels" id="g-scale"></div>
        </div>
        <ul class="echo" id="g-echo"></ul>
      </div>
      <button class="cta" id="g-next"><span id="g-cta"></span></button>
    </section>

    <section class="screen" id="s-loader" style="text-align:center">
      <div class="pulse" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
      <h2 id="l-title" style="font-size:1.5rem"></h2>
      <ul class="checks" id="l-checks"></ul>
    </section>

    <section class="screen" id="s-reveal">
      <div style="text-align:center">
        <div class="badge"><i></i><span id="r-badge"></span></div>
        <h2 class="arch" id="r-arch"></h2>
      </div>
      <svg class="sig" id="r-sig" viewBox="0 0 340 300" role="img" aria-labelledby="sig-desc"></svg>
      <p class="sr" id="sig-desc"></p>
      <div class="aisum" id="r-ai"><span class="tag-ai" id="r-ai-tag"></span><div id="r-ai-body"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>
      <div class="card stack">
        <div class="card-label" id="r-edge-label"></div>
        <h3 id="r-edge"></h3>
        <p id="r-edge-body"></p>
      </div>
      <div class="locked">
        <div class="card">
          <div class="card-label" id="r-lock-label"></div>
          <h3 id="r-lock-title"></h3>
          <p id="r-lock-body"></p>
        </div>
        <div class="veil"><span><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 118 0v3"/></svg><span id="r-lock-pill"></span></span></div>
      </div>
      <button class="cta" id="to-email"><span id="r-cta"></span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </section>

    <section class="screen" id="s-email">
      <div class="qhead">
        <div class="qkicker" id="e-kicker"></div>
        <h2 id="e-title"></h2>
        <p class="qhelp" id="e-help"></p>
      </div>
      <label class="sr" for="email">Email</label>
      <input type="email" id="email" inputmode="email" autocomplete="email" enterkeyhint="go" placeholder="you@example.com" aria-describedby="email-err">
      <p class="err" id="email-err" role="alert"></p>
      <ul class="preview" id="e-preview"></ul>
      <label class="consent"><input type="checkbox" id="consent"><span id="e-consent"></span></label>
      <button class="cta" id="submit"><span id="e-cta"></span></button>
      <p class="reassure"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 118 0v3"/></svg><span id="e-reassure"></span></p>
    </section>

    <section class="screen" id="s-done">
      <div style="text-align:center;display:flex;flex-direction:column;align-items:center">
        <svg class="mascot green" viewBox="0 0 120 120" aria-hidden="true" style="width:84px;height:84px;margin-bottom:2px">
          <ellipse class="cheek" cx="33" cy="70" rx="9" ry="6"/><ellipse class="cheek" cx="87" cy="70" rx="9" ry="6"/>
          <path class="body" d="M60 8c26 0 45 20 45 46 0 24-18 44-45 56C33 98 15 78 15 54 15 28 34 8 60 8z"/>
          <circle class="eye" cx="44" cy="52" r="6"/><circle class="eye" cx="76" cy="52" r="6"/>
          <path class="mouth" d="M44 66q16 16 32 0"/>
        </svg>
        <div class="done-mark"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>
        <h2 id="d-title" style="font-size:clamp(1.6rem,1.1rem + 2.4vw,2.2rem)"></h2>
        <p class="lede" style="text-align:center" id="d-sub"></p>
      </div>
      <div class="card stack">
        <div class="card-label" id="d1-label"></div>
        <h3 id="d1-title"></h3>
        <p id="d1-why"></p>
        <ol class="steps" id="d1-steps" style="margin-top:14px"></ol>
      </div>
      <div class="card">
        <div class="card-label" id="d-week-label"></div>
        <div class="week" id="week"></div>
      </div>
      <p class="promise" id="d-promise"></p>
      <div class="share-row">
        <button id="share"><svg viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M12 15V3M8 7l4-4 4 4"/></svg><span id="d-share"></span></button>
        <button id="restart"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 019-9 9 9 0 016.7 3M21 12a9 9 0 01-9 9 9 9 0 01-6.7-3M21 4v5h-5M3 20v-5h5"/></svg><span id="d-retake"></span></button>
      </div>
      <p class="foot" id="d-foot"></p>
    </section>
  </main>
</div>

<div class="modal" id="modal">
  <div class="box">
    <div class="lbl" id="m-lbl"></div>
    <h3 id="m-q"></h3>
    <div class="row" id="m-row"></div>
  </div>
</div>
<script>
/* ========== SCORING MODEL — language independent ========== */
const QUIZ = [
  {key:'age',     sec:0, type:'list', opts:['18-24','25-34','35-44','45+']},
  {key:'goal',    sec:0, type:'tags', multi:true, opts:['lead','date','network','shrink','speak','friends']},
  {key:'context', sec:0, type:'grid', opts:['work','dating','events','social']},
  {key:'sPresence', sec:1, type:'scale', dim:'presence', reverse:true},
  {key:'sWarmth',   sec:1, type:'scale', dim:'warmth',   reverse:false},
  {key:'sPower',    sec:1, type:'scale', dim:'power',    reverse:true},
  {key:'sSpark',    sec:1, type:'scale', dim:'spark',    reverse:true},
  {key:'model',   sec:2, type:'grid', opts:['obama','oprah','jobs','williams','attenborough','michelle','mlk','swift'],
                  map:{obama:'presence',attenborough:'presence',oprah:'warmth',michelle:'warmth',jobs:'power',mlk:'power',williams:'spark',swift:'spark'}},
  {key:'blocker', sec:2, type:'list', opts:['overthink','quiet','connect','strong']}
];
const TOTAL = 10;
const DIM_KEYS = ['presence','warmth','power','spark'];

/* A/B experiments. Forced with ?v=a|b and ?lock=a|b */
const EXPERIMENTS = {
  hero: {param:'v',    arms:['a','b']},
  lock: {param:'lock', arms:['a','b']}
};

/* ========== COPY — one block per locale ========== */
const L = {};

L.en = {
ui:{cont:'Continue', next:'Continue', pick:'Pick as many as you like'},
sections:['Profile','How you come across','Direction','Plan'],

  facts:['2 min · 10 questions','Presence–warmth–power model','Free · no account'],
  reassure:'We ask for your email at the end — not before.',
  a:{h1:"Most people aren't <em>unlikable</em>. They're unreadable.",
     lede:"Charisma isn't a personality you're born with — it's four habits, and almost everyone is weak in one of them. Ten questions and you'll know which one is costing you the room.",
     cta:'Find my charisma signature'},
  b:{h1:"You don't need to be louder. You need to be <em>readable</em>.",

q:{

      opts:['18–24','25–34','35–44','45 and over']},
 goal:{kicker:'The point of all this', title:'What would you actually do with more charisma?', help:'Pick as many as you like.',
      opts:['Lead a room at work','Date with less second-guessing','Build a network that helps','Stop shrinking around new people','Speak without freezing','Be closer to my friends']},
 context:{kicker:'Where it counts', title:'Where does it matter most right now?', help:"We'll set your practice reps here.",

 sPresence:{kicker:'How you come across', title:'', help:'Does this sound like you?',
      statement:'I catch myself planning my reply instead of listening'},

      statement:'People open up to me faster than I expect'},
 sPower:{kicker:'How you come across', title:'', help:'Does this sound like you?',
      statement:"I soften what I mean so it doesn't land too hard"},
 sSpark:{kicker:'How you come across', title:'', help:'Does this sound like you?',
      statement:'I keep my stories short — I can feel attention drifting'},

      subs:['Calm authority','Makes anyone open up','Total conviction','Pure spark','Unhurried attention','Warmth with steel','Moral force','Room-sized energy']},
 blocker:{kicker:'The honest one', title:'What gets in the way most?',

},

  echo:{goal:'Your goal',context:'Where',block:'Main block'}, cta:'Build my signature'},
loader:{title:'Building your charisma signature',

reveal:{badge:'Your charisma signature', aiTag:'Written for you just now',
  edgeLabel:'Your growth edge', lockLabel:'Day 1 of your plan',

dims:{presence:'Presence',warmth:'Warmth',power:'Power',spark:'Spark'},
arch:{

 warmth:{name:'The Warm Front', line:'You make people feel safe quickly. Rooms loosen up around you, and people tell you things they had not planned to say.'},

 spark:{name:'The Live Wire', line:'You bring the energy and the room turns toward it. Nothing feels flat when you are in it.'}},

<script>
/* ================= ENGINE ================= */
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);

const FLOW = [
  {t:'q',i:0},{t:'q',i:1},{t:'q',i:2},
  {t:'s',id:'proof'},
  {t:'q',i:3},
  {t:'s',id:'typology'},
  {t:'q',i:4},{t:'q',i:5},
  {t:'s',id:'stat'},
  {t:'q',i:6},{t:'q',i:7},{t:'q',i:8},
  {t:'s',id:'gauge'},{t:'s',id:'loader'},{t:'s',id:'reveal'},
  {t:'email'},{t:'done'}
];
const SCREEN_OF = {proof:'s-proof',typology:'s-typology',stat:'s-stat',gauge:'s-gauge',loader:'s-loader',reveal:'s-reveal'};

const S = {
  step:-1, answers:{}, extra:{}, scores:null, top:null, edge:null,
  locale:'en', arms:{}, ref:null, myRef:null, startedAt:null, email:null, ai:null
};

/* ---- locale ---- */
function pickLocale(){
  const q = (P.get('lang')||'').toLowerCase();
  if (L[q]) return q;
  const nav = (navigator.language||'en').slice(0,2).toLowerCase();
  return L[nav] ? nav : 'en';
}
let T = null;
function setLocale(loc){
  S.locale = loc; T = L[loc];
  document.documentElement.lang = loc;
  $('lang').value = loc;
  paintStatic();
  if (S.step >= 0) render(S.step, true); else null;
}

/* ---- A/B ---- */
Object.entries(EXPERIMENTS).forEach(([name,cfg])=>{
  const forced = P.get(cfg.param);
  S.arms[name] = cfg.arms.includes(forced) ? forced : cfg.arms[Math.floor(Math.random()*cfg.arms.length)];
});

/* ---- referral ---- */
S.ref = P.get('ref');
S.myRef = Math.random().toString(36).slice(2,8).toUpperCase();

/* ---- analytics ---- */
window.dataLayer = window.dataLayer || [];
function track(event, props={}){
  const body = {event, props, variant:S.arms.hero, arms:S.arms, locale:S.locale,
                ref:S.ref, session:S.myRef, ts:Date.now()};
  window.dataLayer.push(body);
  if (window.va) window.va('event',{name:event,data:props});
  try{
    const blob = new Blob([JSON.stringify(body)],{type:'application/json'});
    const queued = navigator.sendBeacon && navigator.sendBeacon('/api/events', blob);
    if (!queued) fetch('/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),keepalive:true}).catch(()=>{});
  }catch(_){}
}

/* ---- theme ---- */
const SUN='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>';
const MOON='<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>';
let theme = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
$('theme-icon').innerHTML = theme==='dark'?MOON:SUN;
$('theme').onclick = ()=>{
  theme = theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme = theme;
  $('theme-icon').innerHTML = theme==='dark'?MOON:SUN;
  track('theme_toggled',{theme});
};
$('lang').onchange = e => { setLocale(e.target.value); track('locale_changed',{locale:e.target.value}); };

/* ---- progress ---- */
$('segs').innerHTML = QUIZ.map(q=>`<div class="seg" data-sec="${q.sec}"><i></i></div>`).join('');
const SEGS=[...document.querySelectorAll('.seg')];
function qDoneBefore(step){ return FLOW.slice(0,step).filter(f=>f.t==='q').length; }
function setProgress(step){
  if (step < 0){ $('progress').classList.remove('on'); return; }
  const f = FLOW[step];
  const done = qDoneBefore(step);
  const isQ = f.t==='q' || f.t==='email';
  const shown = f.t==='done' ? TOTAL : done;
  $('progress').classList.add('on');
  SEGS.forEach((s,n)=>{ s.classList.toggle('done', n<shown); s.classList.toggle('now', isQ && n===shown); });
  const sec = f.t==='q' ? T.sections[QUIZ[f.i].sec] : (f.t==='email'||f.t==='done') ? T.sections[3] :
              T.sections[QUIZ[Math.max(0,done-1)].sec];
  const num = f.t==='done' ? `${TOTAL}/${TOTAL}` : isQ ? `${shown+1}/${TOTAL}` : `${shown}/${TOTAL}`;
  $('plabel').innerHTML = `${sec} · <b>${num}</b>`;
  document.documentElement.style.setProperty('--field', 0.4 + (shown/TOTAL)*0.45);
}

/* ---- screen swap ---- */
let current = $('s-hero');
function show(el, after){
  if (el===current){ if(after) after(); return; }
  const prev=current; prev.classList.add('out');
  setTimeout(()=>{
    prev.classList.remove('on','out'); el.classList.add('on'); current=el;
    try{ window.scrollTo({top:0,behavior:'instant'}); }catch(_){}
    if(after) after();
  },170);
}

/* ---- static copy ---- */
function paintStatic(){
  const h=T.hero, arm=h[S.arms.hero];
  $('h-eyebrow').textContent=h.eyebrow;
  $('h-title').innerHTML=arm.h1;
  $('h-lede').textContent=arm.lede;
  $('h-cta').textContent=arm.cta;
  $('h-reassure').textContent=h.reassure;
  $('h-facts').innerHTML=h.facts.map(f=>`<li>${f}</li>`).join('');
  document.querySelectorAll('.cont').forEach(n=>n.textContent=T.ui.cont);
  $('p-big').textContent=T.proof.big; $('p-sub').textContent=T.proof.sub;
  $('p-quote').textContent=T.proof.quote; $('p-byline').textContent=T.proof.byline;
  $('p-presslabel').textContent=T.proof.press;
  $('ty-title').textContent=T.typology.title; $('ty-sub').textContent=T.typology.sub;
  $('ty-teaser').textContent=T.typology.teaser;
  $('ty-cards').innerHTML=T.typology.cards.map(([a,b])=>`<div class="dimcard"><b>${a}</b><span>${b}</span></div>`).join('');
  $('st-big').textContent=T.stat.big; $('st-title').textContent=T.stat.title;
  $('st-cite').textContent=T.stat.cite; $('st-body').textContent=T.stat.body;
  $('g-title').textContent=T.gauge.title; $('g-label').textContent=T.gauge.label; $('g-cta').textContent=T.gauge.cta;
  $('g-scale').innerHTML=T.gauge.levels.map(x=>`<span>${x}</span>`).join('');
  $('l-title').textContent=T.loader.title;
  $('r-badge').textContent=T.reveal.badge; $('r-ai-tag').textContent=T.reveal.aiTag;
  $('r-edge-label').textContent=T.reveal.edgeLabel; $('r-lock-label').textContent=T.reveal.lockLabel;
  $('r-lock-title').textContent=T.reveal.lockTitle; $('r-lock-body').textContent=T.reveal.lockBody;
  $('r-lock-pill').textContent=T.reveal.lockPill; $('r-cta').textContent=T.reveal.cta;
  $('e-kicker').textContent=T.email.kicker; $('e-title').textContent=T.email.title;
  $('e-preview').innerHTML=T.email.preview.map(x=>`<li><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg><span>${x}</span></li>`).join('');
  $('e-consent').textContent=T.email.consent; $('e-cta').textContent=T.email.cta; $('e-reassure').textContent=T.email.reassure;
  $('d-title').textContent=T.done.title; $('d-week-label').textContent=T.done.weekLabel;
  $('d-share').textContent=T.done.share; $('d-retake').textContent=T.done.retake; $('d-foot').textContent=T.done.foot;
}

/* ---- router ---- */
function goto(step){
  S.step = step;
  const f = FLOW[step];
  setProgress(step);
  $('back').hidden = !(f.t==='q' || f.t==='email' || (f.t==='s' && f.id!=='loader'));
  if (f.t==='q') renderQuestion(f.i);
  else if (f.t==='email') showEmail();
  else if (f.t==='done') showDone();
  else if (f.id==='gauge') showGauge();
  else if (f.id==='loader') showLoader();
  else if (f.id==='reveal') showReveal();
  else show($(SCREEN_OF[f.id]));
}
function render(step, keep){ if(step>=0) goto(step); }
function next(){ goto(S.step+1); }
$('back').onclick = ()=>{
  if (S.step<=0){ S.step=-1; setProgress(-1); $('back').hidden=true; show($('s-hero')); return; }
  let p=S.step-1;
  while(p>0 && FLOW[p].t==='s' && (FLOW[p].id==='loader'||FLOW[p].id==='gauge')) p--;
  goto(p);
};
['p-next','ty-next','st-next'].forEach(id=>$(id).onclick=next);
$('start').onclick = ()=>{ S.startedAt=Date.now(); track('quiz_start'); goto(0); };

/* ---- questions ---- */
function renderQuestion(i){
  const q=QUIZ[i], c=T.q[q.key], num=i+1;
  $('q-kicker').textContent = c.kicker;
  $('q-title').innerHTML = q.type==='scale' ? `<span class="statement">${c.statement}</span>` : c.title;
  $('q-help').textContent = c.help||''; $('q-help').style.display = c.help?'block':'none';
  const body=$('q-body'); const nextBtn=$('q-next');
  nextBtn.hidden = !q.multi; $('q-next-label').textContent = T.ui.next;

  if (q.type==='scale'){
    body.className=''; body.innerHTML = `<div class="scale">` + T.scale.map((lab,n)=>{
      const d = 8 + n*3;
      return `<button class="sc" data-n="${n}"><span style="width:${d}px;height:${d}px;border-radius:50%;background:currentColor;display:block"></span>${lab}</button>`;
    }).join('') + `</div>`;
  } else if (q.type==='tags'){
    body.className=''; body.innerHTML = `<div class="tagwrap">` +
      c.opts.map((t,n)=>`<button class="tag" data-n="${n}">${t}</button>`).join('') + `</div>`;
  } else {
    body.className = q.type==='grid' ? 'opts grid' : 'opts';
    body.innerHTML = c.opts.map((t,n)=>{
      const sub = c.subs ? `<span class="sub">${c.subs[n]}</span>` : '';
      const cls = q.type==='grid' && c.subs ? 'opt card' : 'opt';
      return `<button class="${cls}" data-n="${n}"><span class="key">${n+1}</span><span class="txt">${t}${sub}</span></button>`;
    }).join('');
  }
  const sel = S.answers[q.key];
  if (q.multi && Array.isArray(sel)) sel.forEach(n=>body.querySelector(`[data-n="${n}"]`)?.classList.add('chosen'));
  show($('s-question'));
}

function commit(i, n){
  const q=QUIZ[i], c=T.q[q.key];
  if (q.multi){
    const cur = Array.isArray(S.answers[q.key]) ? S.answers[q.key].slice() : [];
    const at = cur.indexOf(n);
    if (at>=0) cur.splice(at,1); else cur.push(n);
    S.answers[q.key]=cur;
    $('q-body').querySelector(`[data-n="${n}"]`).classList.toggle('chosen', at<0);
    return;
  }
  if ($('q-body').querySelector('.picked')) return;
  S.answers[q.key]=n;
  const el=$('q-body').querySelector(`[data-n="${n}"]`);
  el.classList.add('picked');
  track('question_answered',{n:i+1,key:q.key,value:q.type==='scale'?n:(q.opts?q.opts[n]:n)});
  setTimeout(next,260);
}
$('q-body').onclick = e=>{
  const b=e.target.closest('[data-n]'); if(!b) return;
  const f=FLOW[S.step]; if(f.t!=='q') return;
  commit(f.i, +b.dataset.n);
};
$('q-next').onclick = ()=>{
  const f=FLOW[S.step]; const q=QUIZ[f.i];
  const sel=S.answers[q.key];
  if(!Array.isArray(sel)||!sel.length) return;
  track('question_answered',{n:f.i+1,key:q.key,value:sel.map(n=>q.opts[n]).join('|')});
  next();
};
document.addEventListener('keydown',e=>{
  const f=FLOW[S.step]; if(!f||f.t!=='q') return;
  if(/^[1-5]$/.test(e.key)){ const b=$('q-body').querySelector(`[data-n="${+e.key-1}"]`); if(b) commit(f.i,+e.key-1); }
});

/* ---- scoring ---- */
function computeScores(){
  const out={};
  QUIZ.filter(q=>q.type==='scale').forEach(q=>{
    const raw = S.answers[q.key];
    const v = (raw==null) ? 2 : (q.reverse ? 4-raw : raw);
    out[q.dim] = Math.round(28 + (v/4)*68);
  });
  return out;
}
const rank=(s,dir)=>DIM_KEYS.slice().sort((a,b)=>dir*(s[b]-s[a]))[0];
function val(key){ const q=QUIZ.find(x=>x.key===key); const a=S.answers[key];
  return Array.isArray(a) ? a.map(n=>q.opts[n]) : (a==null?null:q.opts[a]); }

/* ---- gauge ---- */
function showGauge(){
  S.scores=computeScores(); S.top=rank(S.scores,1); S.edge=rank(S.scores,-1);
  if(S.edge===S.top) S.edge = DIM_KEYS.slice().sort((a,b)=>S.scores[a]-S.scores[b]).find(d=>d!==S.top) || S.edge;
  const avg = DIM_KEYS.reduce((s,d)=>s+S.scores[d],0)/4;
  const pos = Math.max(6,Math.min(94, avg));
  $('g-pin').style.left=pos+'%'; $('g-mark').style.left=pos+'%'; $('g-mark').textContent=T.gauge.marker;
  const goals=(val('goal')||[]).map(g=>T.goals[g]).filter(Boolean);
  const e=T.gauge.echo;
  $('g-echo').innerHTML = [
    [e.goal, goals[0]||'—'],
    [e.context, T.reps[val('context')]||'—'],
    [e.block, T.q.blocker.opts[S.answers.blocker] ?? '—']
  ].map(([k,v])=>`<li><b>${k}</b><span>${v}</span></li>`).join('');
  $('g-next').onclick=next;
  show($('s-gauge'));
  track('gauge_view',{avg:Math.round(avg), edge:S.edge, top:S.top});
}

/* ---- loader with micro-questions ---- */
function showLoader(){
  const cs=T.loader.checks;
  $('l-checks').innerHTML=cs.map(c=>`<li><span>${c}</span><span class="mark">0%</span></li>`).join('');
  show($('s-loader'));
  track('loader_view');
  fetchSummary();
  const items=[...$('l-checks').children];
  let idx=0, pct=0, asked=0;
  const tick=setInterval(()=>{
    pct+=Math.random()*22+10;
    if(pct>=100){
      items[idx].classList.add('done'); items[idx].querySelector('.mark').textContent='✓';
      idx++; pct=0;
      if(idx===1||idx===3){ if(asked<T.loader.micro.length){ clearInterval(tick); askMicro(asked++, ()=>showLoader2(idx,asked)); return; } }
      if(idx>=items.length){ clearInterval(tick); setTimeout(next,420); return; }
    } else items[idx].querySelector('.mark').textContent=Math.round(pct)+'%';
  },320);
  S._tick=()=>clearInterval(tick);
  function showLoader2(from,askedN){
    let i2=from,p2=0;
    const t2=setInterval(()=>{
      p2+=Math.random()*22+12;
      if(p2>=100){
        items[i2].classList.add('done'); items[i2].querySelector('.mark').textContent='✓';
        i2++; p2=0;
        if(i2===3 && askedN<T.loader.micro.length){ clearInterval(t2); askMicro(askedN, ()=>showLoader2(i2,askedN+1)); return; }
        if(i2>=items.length){ clearInterval(t2); setTimeout(next,420); return; }
      } else items[i2].querySelector('.mark').textContent=Math.round(p2)+'%';
    },300);
  }
}
function askMicro(n, done){
  const m=T.loader.micro[n];
  $('m-lbl').textContent=m.lbl; $('m-q').textContent=m.q;
  $('m-row').innerHTML=`<button data-v="${m.av}">${m.a}</button><button data-v="${m.bv}">${m.b}</button>`;
  $('modal').classList.add('on');
  $('m-row').onclick=e=>{
    const b=e.target.closest('button'); if(!b) return;
    S.extra[m.key]=b.dataset.v;
    track('micro_answered',{key:m.key,value:b.dataset.v});
    $('modal').classList.remove('on'); done();
  };
}

/* ---- AI summary ---- */
async function fetchSummary(){
  const payload={locale:S.locale, scores:S.scores, archetype:S.top, edge:S.edge,
    goal:(val('goal')||[])[0], context:val('context'), blocker:val('blocker'), model:val('model'), age:val('age')};
  try{
    const r=await fetch('/api/summary',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const d=await r.json();
    if(d && d.summary) { S.ai=d.summary; S.aiSource=d.source||'ai'; return; }
    throw new Error('no summary');
  }catch(_){
    S.ai=fallbackSummary(); S.aiSource='fallback';
  }
}
function fallbackSummary(){
  const d=T.dims, hi=d[S.top].toLowerCase(), lo=d[S.edge].toLowerCase();
  const g=(val('goal')||[]).map(x=>T.goals[x]).filter(Boolean)[0]||'';
  return `${T.arch[S.top].name} · ${T.edges[S.edge].title.toLowerCase()}. ${hi} → ${S.scores[S.top]}, ${lo} → ${S.scores[S.edge]}. ${g?g:''}`;
}

/* ---- signature ---- */
function buildSignature(sc){
  const cx=170,cy=142,base=26,max=62,K=.5523;
  const order=['presence','spark','power','warmth'];
  const ang=[-90,0,90,180].map(a=>a*Math.PI/180);
  const R=order.map(d=>base+(sc[d]/100)*max);
  const Pt=R.map((r,i)=>[cx+r*Math.cos(ang[i]), cy+r*Math.sin(ang[i])]);
  const Tg=ang.map(a=>[-Math.sin(a),Math.cos(a)]);
  let d=`M ${Pt[0][0].toFixed(1)} ${Pt[0][1].toFixed(1)}`;
  for(let i=0;i<4;i++){ const j=(i+1)%4,k1=K*R[i],k2=K*R[j];
    d+=` C ${(Pt[i][0]+Tg[i][0]*k1).toFixed(1)} ${(Pt[i][1]+Tg[i][1]*k1).toFixed(1)}, ${(Pt[j][0]-Tg[j][0]*k2).toFixed(1)} ${(Pt[j][1]-Tg[j][1]*k2).toFixed(1)}, ${Pt[j][0].toFixed(1)} ${Pt[j][1].toFixed(1)}`; }
  d+=' Z';
  const rings=[.4,.7,1].map(f=>`<circle class="ring" cx="${cx}" cy="${cy}" r="${(base+max)*f}"/>`).join('');
  const dots=Pt.map(p=>`<circle class="dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4"/>`).join('');
  const lab=[['presence',170,24,'middle',42],['spark',278,136,'start',154],['power',170,256,'middle',274],['warmth',62,136,'end',154]]
    .map(([k,x,y,a,vy])=>`<text class="lbl" x="${x}" y="${y}" text-anchor="${a}">${T.dims[k]}</text><text class="val" x="${x}" y="${vy}" text-anchor="${a}">${sc[k]}</text>`).join('');
  $('r-sig').innerHTML=`<defs><linearGradient id="sigline" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="var(--ember)"/><stop offset="100%" stop-color="var(--iris)"/></linearGradient></defs>${rings}<path class="blob" d="${d}"/>${dots}${lab}`;
  $('sig-desc').textContent=DIM_KEYS.map(k=>`${T.dims[k]} ${sc[k]}/100`).join(', ');
}

/* ---- reveal ---- */
function showReveal(){
  const a=T.arch[S.top], e=T.edges[S.edge];
  $('r-arch').innerHTML=`${a.name}<small>${a.line}</small>`;
  $('r-edge').textContent=e.title;
  const modelName=T.q.model.opts[S.answers.model];
  const gap = (modelName && QUIZ[7].map[val('model')]!==S.edge)
    ? ' ' + T.reveal.gap(modelName, T.dims[S.edge]) : '';
  $('r-edge-body').textContent=e.body+gap;
  buildSignature(S.scores);
  $('r-ai-body').textContent = S.ai || fallbackSummary();
  if(!S.ai){ const iv=setInterval(()=>{ if(S.ai){ $('r-ai-body').textContent=S.ai; clearInterval(iv);} },200); setTimeout(()=>clearInterval(iv),6000); }
  if(S.arms.lock==='b'){ document.querySelector('.locked .veil').style.display='none';
    document.querySelectorAll('.locked .card p,.locked .card h3').forEach(n=>n.style.filter='none'); }
  $('to-email').onclick=next;
  show($('s-reveal'));
  track('reveal_view',{archetype:a.name,edge:S.edge,...S.scores,ai:S.aiSource||'pending'});
}

/* ---- email ---- */
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i;
let sending=false;
function showEmail(){
  const g=(val('goal')||[]).map(x=>T.goals[x]).filter(Boolean)[0]||'';
  $('e-help').textContent = `${T.dims[S.edge]} · ${g}`;
  show($('s-email'), ()=>$('email').focus({preventScroll:true}));
  track('email_view');
}
$('email').oninput=()=>{ $('email').setAttribute('aria-invalid','false'); $('email-err').textContent=''; };
$('email').onkeydown=e=>{ if(e.key==='Enter') submit(); };
$('submit').onclick=submit;
async function submit(){
  if(sending) return;
  const email=$('email').value.trim();
  if(!EMAIL_RE.test(email)){ $('email').setAttribute('aria-invalid','true'); $('email-err').textContent=T.email.errInvalid; $('email').focus(); track('email_invalid'); return; }
  if(!$('consent').checked){ $('email-err').textContent=T.email.errConsent; track('consent_missing'); return; }
  sending=true; $('submit').disabled=true; $('e-cta').textContent=T.email.sending; $('email-err').textContent='';
  S.email=email;
  const payload={
    email, locale:S.locale, archetype:T.arch[S.top].name, top:S.top, edge:S.edge, scores:S.scores,
    aiSummary:S.ai, aiSource:S.aiSource,
    answers:QUIZ.map((q,i)=>({n:i+1,key:q.key,question:T.q[q.key].title||T.q[q.key].statement,
      answer: q.type==='scale' ? T.scale[S.answers[q.key]??2]
        : Array.isArray(S.answers[q.key]) ? S.answers[q.key].map(n=>T.q[q.key].opts[n]).join(', ')
        : (T.q[q.key].opts[S.answers[q.key]] ?? '—')})),
    extra:S.extra,
    meta:{arms:S.arms, variant:S.arms.hero, ref:S.ref, session:S.myRef,
      secondsToComplete:S.startedAt?Math.round((Date.now()-S.startedAt)/1000):null,
      referrer:document.referrer||'direct',
      utm:{source:P.get('utm_source'),medium:P.get('utm_medium'),campaign:P.get('utm_campaign')},
      device:/Mobi|Android|iPhone/i.test(navigator.userAgent)?'mobile':'desktop', language:navigator.language}
  };
  try{
    const r=await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!r.ok) throw new Error('HTTP '+r.status);
    track('lead_submitted',{archetype:payload.archetype,edge:S.edge});
    next();
  }catch(err){
    sending=false; $('submit').disabled=false; $('e-cta').textContent=T.email.retry;
    $('email-err').textContent=T.email.errFail; track('submit_failed',{message:String(err.message||err)});
  }
}

/* ---- success ---- */
function showDone(){
  const plan=T.plans[S.edge], mins=S.extra.time||'10';
  const rep=T.reps[val('context')]||'';
  $('d-sub').textContent=T.done.sub(S.email, rep);
  $('d1-label').textContent=T.done.d1Label(mins);
  $('d1-title').textContent=plan.title;
  $('d1-why').textContent=plan.why+' '+(T.blockerNote[val('blocker')]||'');
  $('d1-steps').innerHTML=plan.steps.map(([b,p])=>`<li><div><b>${b}</b><p>${p}</p></div></li>`).join('');
  $('week').innerHTML=plan.week.map(([d,t])=>`<div><span>${d}</span>${t}</div>`).join('');
  const dt=new Date(Date.now()+14*864e5);
  const date=dt.toLocaleDateString(S.locale==='en'?'en-GB':S.locale,{day:'numeric',month:'long'});
  const goal=(val('goal')||[]).map(x=>T.goals[x]).filter(Boolean)[0]||'';
  $('d-promise').innerHTML=T.done.promise(date,goal);
  show($('s-done'), confetti);
  track('success_view',{edge:S.edge,mins});
}
function confetti(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=$('confetti'), cols=['#FF9D5C','#FFD98E','#9B8CFF','#5DCAA5'];
  for(let i=0;i<44;i++){
    const p=document.createElement('i');
    p.style.left=Math.random()*100+'vw'; p.style.top='-20px';
    p.style.background=cols[i%4]; p.style.animationDuration=(2+Math.random()*1.6)+'s';
    p.style.animationDelay=(Math.random()*.5)+'s';
    c.appendChild(p); setTimeout(()=>p.remove(),4200);
  }
}

/* ---- share / restart ---- */
$('share').onclick=async()=>{
  const url=`${location.origin}${location.pathname}?ref=${S.myRef}&lang=${S.locale}&utm_source=share&utm_medium=referral`;
  const text=`${T.arch[S.top].name} — ${T.reveal.badge}?`;
  track('share_clicked',{code:S.myRef});
  try{
    if(navigator.share) await navigator.share({title:'Charisma Signature',text,url});
    else { await navigator.clipboard.writeText(`${text} ${url}`); $('d-share').textContent=T.done.shared; }
  }catch(_){}
};
$('restart').onclick=()=>{
  S.answers={}; S.extra={}; S.scores=null; S.ai=null; sending=false; S.step=-1;
  $('email').value=''; $('consent').checked=false; $('submit').disabled=false;
  $('e-cta').textContent=T.email.cta; $('d-share').textContent=T.done.share;
  $('r-ai-body').innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  track('retake'); setProgress(-1); $('back').hidden=true; show($('s-hero'));
};

/* ---- boot ---- */
setLocale(pickLocale());
track('funnel_view',{referrer:document.referrer||'direct', ref:S.ref});
</script>
</body>
